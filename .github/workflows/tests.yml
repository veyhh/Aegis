name: AEGIS source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  parser-and-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: bash -n tools/wine-common.sh tools/wine-install-driver.sh tools/wine-run-test.sh
      - run: python -m unittest discover -s tests -v
      - run: shellcheck tools/wine-common.sh tools/wine-install-driver.sh tools/wine-run-test.sh
  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S client/pushlock -B build/client -A x64
      - run: cmake --build build/client --config Release
